<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TEPHDY TECH | TEPHDY AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Libraries for 3D graphics, Markdown parsing, and syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-black: #060606;
      --bg-card: rgba(18, 16, 12, 0.85);
      --border-gold: rgba(212, 175, 55, 0.2);
      --gold-primary: #ffd700;
      --gold-glow: #d4af37;
      --gold-light: #fef08a;
      --text-white: #fafafa;
      --text-muted: #71717a;
    }

    /* CSS Theme Presets */
    [data-theme="cyberpunk"] {
      --gold-primary: #00f3ff;
      --gold-glow: #00a8ff;
      --gold-light: #80f7ff;
      --border-gold: rgba(0, 243, 255, 0.25);
      --bg-card: rgba(10, 16, 24, 0.85);
    }

    [data-theme="emerald"] {
      --gold-primary: #10b981;
      --gold-glow: #059669;
      --gold-light: #6ee7b7;
      --border-gold: rgba(16, 185, 129, 0.25);
      --bg-card: rgba(8, 18, 14, 0.85);
    }

    [data-theme="amethyst"] {
      --gold-primary: #c084fc;
      --gold-glow: #9333ea;
      --gold-light: #e9d5ff;
      --border-gold: rgba(192, 132, 252, 0.25);
      --bg-card: rgba(16, 10, 22, 0.85);
    }

    [data-theme="crimson"] {
      --gold-primary: #f43f5e;
      --gold-glow: #e11d48;
      --gold-light: #fecdd3;
      --border-gold: rgba(244, 63, 94, 0.25);
      --bg-card: rgba(24, 10, 14, 0.85);
    }

    [data-theme="sunset"] {
      --gold-primary: #f97316;
      --gold-glow: #ea580c;
      --gold-light: #ffedd5;
      --border-gold: rgba(249, 115, 22, 0.25);
      --bg-card: rgba(24, 14, 10, 0.85);
    }

    [data-theme="midnight"] {
      --gold-primary: #3b82f6;
      --gold-glow: #2563eb;
      --gold-light: #bfdbfe;
      --border-gold: rgba(59, 130, 246, 0.25);
      --bg-card: rgba(10, 14, 24, 0.85);
    }

    /* Monochrome / Dark Themes */
    [data-theme="obsidian"] {
      --gold-primary: #ffffff;
      --gold-glow: #a1a1aa;
      --gold-light: #ffffff;
      --border-gold: rgba(255, 255, 255, 0.25);
      --bg-card: rgba(10, 10, 10, 0.9);
      --bg-black: #000000;
    }

    [data-theme="slate"] {
      --gold-primary: #94a3b8;
      --gold-glow: #64748b;
      --gold-light: #cbd5e1;
      --border-gold: rgba(148, 163, 184, 0.25);
      --bg-card: rgba(15, 23, 42, 0.85);
    }

    [data-theme="silver"] {
      --gold-primary: #e2e8f0;
      --gold-glow: #94a3b8;
      --gold-light: #f8fafc;
      --border-gold: rgba(226, 232, 240, 0.25);
      --bg-card: rgba(18, 20, 24, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-black);
      color: var(--text-white);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Animated Canvas Background */
    #bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-gold);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--gold-glow);
    }

    .glow-aura {
      position: fixed;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .app-viewport {
        width: 95vw;
        max-width: 1100px;
        height: 88vh;
        border: 1px solid var(--border-gold);
        border-radius: 20px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.05);
      }
    }

    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sidebar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: rgba(12, 10, 6, 0.95);
      border-right: 1px solid var(--border-gold);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
      z-index: 20;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    @media (min-width: 768px) {
      .sidebar {
        position: relative;
        transform: none;
        background: rgba(10, 8, 4, 0.6);
      }
      .sidebar-overlay {
        display: none;
      }
    }

    .btn-new-chat {
      background: rgba(212, 175, 55, 0.1);
      color: var(--gold-primary);
      border: 1px solid var(--border-gold);
      padding: 0.75rem 1rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-new-chat:hover {
      background: rgba(212, 175, 55, 0.2);
    }

    .btn-new-chat:active {
      background: rgba(212, 175, 55, 0.3);
    }

    .history-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0 0.5rem;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .history-item {
      padding: 0.75rem 0.8rem;
      border-radius: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }

    .history-item:hover {
      background: rgba(212, 175, 55, 0.06);
      color: var(--text-white);
    }

    .history-item.active {
      background: rgba(212, 175, 55, 0.12);
      color: var(--gold-light);
    }

    .history-item .item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px 8px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }

    header {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border-gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 8, 4, 0.6);
    }

    .left-nav {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .theme-dropdown {
      background: rgba(20, 18, 12, 0.8);
      color: var(--gold-light);
      border: 1px solid var(--border-gold);
      padding: 0.4rem 0.6rem;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-dropdown:hover {
      background: rgba(30, 26, 18, 0.9);
    }

    .theme-dropdown option {
      background: #0f0f0f;
      color: #fafafa;
    }

    .menu-btn {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid var(--border-gold);
      color: var(--gold-primary);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    @media (min-width: 768px) {
      .menu-btn {
        display: none;
      }
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    #avatar-canvas {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.05);
      border: 1px solid var(--border-gold);
    }

    .logo-group {
      display: flex;
      flex-direction: column;
    }

    .brand-subtitle {
      font-size: 0.55rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      letter-spacing: 0.12em;
    }

    .logo {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .logo span {
      color: var(--gold-primary);
    }

    .status-badge {
      background: rgba(20, 18, 12, 0.8);
      color: var(--gold-light);
      border: 1px solid var(--border-gold);
      padding: 0.4rem 0.8rem;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .chat-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    @media (min-width: 768px) {
      .chat-box {
        padding: 1.5rem 2rem;
        gap: 1rem;
      }
    }

    .message {
      max-width: 88%;
      padding: 0.8rem 1.1rem;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 0.88rem;
      word-break: break-word;
      animation: fadeIn 0.25s ease;
    }

    .message p {
      margin-bottom: 0.5rem;
    }

    .message p:last-child {
      margin-bottom: 0;
    }

    .message ul, .message ol {
      margin-left: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .message pre {
      background: #1e1e1e;
      padding: 0.75rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.5rem 0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .message code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
    }

    .message :not(pre) > code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--gold-light);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--border-gold);
      color: var(--gold-light);
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom-left-radius: 2px;
      color: var(--text-white);
    }

    .typing-cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background-color: var(--gold-primary);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .thinking-notice {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
    }

    .thinking-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--border-gold);
      border-top: 2px solid var(--gold-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .input-deck {
      padding: 0.8rem 1rem;
      background: rgba(10, 8, 4, 0.7);
      border-top: 1px solid var(--border-gold);
    }

    @media (min-width: 768px) {
      .input-deck {
        padding: 1.25rem 2rem;
      }
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(22, 19, 14, 0.9);
      border: 1px solid var(--border-gold);
      border-radius: 14px;
      padding: 0.4rem 0.5rem 0.4rem 0.8rem;
    }

    textarea {
      flex: 1;
      background: transparent;
      color: var(--text-white);
      border: none;
      outline: none;
      resize: none;
      height: 24px;
      max-height: 90px;
      font-family: inherit;
      font-size: 0.9rem;
    }

    .btn-gold {
      background: var(--gold-primary);
      color: #050505;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-gold:hover:not(:disabled) {
      opacity: 0.9;
    }

    .btn-gold:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Background Particle Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="glow-aura"></div>

  <div class="app-viewport">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar / Mobile Drawer -->
    <div class="sidebar" id="sidebar">
      <button class="btn-new-chat" id="new-chat-btn">+ New Chat</button>
      <div class="history-title">Chat History</div>
      <div class="history-list" id="history-list"></div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <header>
        <div class="left-nav">
          <button class="menu-btn" id="menu-btn">&#9776;</button>
          <div class="brand-group">
            <div id="avatar-canvas"></div>
            <div class="logo-group">
              <span class="brand-subtitle">TEPHDY TECH</span>
              <div class="logo">Tephdy <span>AI</span></div>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <select id="theme-select" class="theme-dropdown">
            <option value="gold">Gold (Default)</option>
            <option value="obsidian">Obsidian (Black & White)</option>
            <option value="slate">Slate (Black & Gray)</option>
            <option value="silver">Silver Metallic</option>
            <option value="cyberpunk">Neon Cyan</option>
            <option value="emerald">Emerald Green</option>
            <option value="amethyst">Amethyst Purple</option>
            <option value="crimson">Crimson Red</option>
            <option value="sunset">Sunset Orange</option>
            <option value="midnight">Midnight Blue</option>
          </select>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span>ONLINE</span>
          </div>
        </div>
      </header>

      <div class="chat-section">
        <div class="chat-box" id="chat-box"></div>

        <div class="input-deck">
          <div class="input-wrapper">
            <textarea id="prompt-input" rows="1" placeholder="Message Tephdy..."></textarea>
            <button class="btn-gold" id="send-btn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================
       1. BACKGROUND CANVAS ANIMATION
       ========================================================= */
    const bgCanvas = document.getElementById('bg-canvas');
    const ctx = bgCanvas.getContext('2d');

    let particles = [];
    let particleColor = 'rgba(212, 175, 55, ';

    function resizeBgCanvas() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBgCanvas);
    resizeBgCanvas();

    class Particle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * bgCanvas.width;
        this.y = Math.random() * bgCanvas.height;
        this.vx = (Math.random() - 0.5) * 0.4;
        this.vy = (Math.random() - 0.5) * 0.4;
        this.radius = Math.random() * 1.8 + 0.6;
        this.alpha = Math.random() * 0.5 + 0.2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > bgCanvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > bgCanvas.height) this.vy *= -1;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = particleColor + this.alpha + ')';
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 12000);
      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }
    }

    function animateBg() {
      ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();

        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 110) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = particleColor + (1 - dist / 110) * 0.15 + ')';
            ctx.lineWidth = 0.6;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(animateBg);
    }

    initParticles();
    animateBg();

    /* =========================================================
       2. MARKDOWN & SYNTAX HIGHLIGHTING CONFIGURATION
       ========================================================= */
    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
      const validLang = language && hljs.getLanguage(language) ? language : 'plaintext';
      const highlighted = hljs.highlight(code, { language: validLang }).value;
      return `<pre><code class="hljs ${validLang}">${highlighted}</code></pre>`;
    };

    marked.use({ renderer, breaks: true });

    /* =========================================================
       3. 3D GOLD ICON
       ========================================================= */
    const avatarContainer = document.getElementById('avatar-canvas');
    const avatarScene = new THREE.Scene();
    const avatarCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    const avatarRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    avatarRenderer.setSize(36, 36);
    avatarContainer.appendChild(avatarRenderer.domElement);

    const goldMaterial = new THREE.MeshBasicMaterial({ color: 0xffd700, wireframe: true });
    const headMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 1), goldMaterial);
    avatarScene.add(headMesh);
    avatarCamera.position.z = 3.5;

    let isThinking = false;
    function animateAvatar() {
      requestAnimationFrame(animateAvatar);
      headMesh.rotation.y += isThinking ? 0.08 : 0.01;
      headMesh.rotation.x += isThinking ? 0.03 : 0.005;
      avatarRenderer.render(avatarScene, avatarCamera);
    }
    animateAvatar();

    /* =========================================================
       4. THEME SWITCHER LOGIC
       ========================================================= */
    const themeSelect = document.getElementById('theme-select');
    const theme3DColors = {
      gold: 0xffd700,
      obsidian: 0xffffff,
      slate: 0x94a3b8,
      silver: 0xe2e8f0,
      cyberpunk: 0x00f3ff,
      emerald: 0x10b981,
      amethyst: 0xc084fc,
      crimson: 0xf43f5e,
      sunset: 0xf97316,
      midnight: 0x3b82f6
    };

    const particleRgbColors = {
      gold: 'rgba(212, 175, 55, ',
      obsidian: 'rgba(255, 255, 255, ',
      slate: 'rgba(148, 163, 184, ',
      silver: 'rgba(226, 232, 240, ',
      cyberpunk: 'rgba(0, 243, 255, ',
      emerald: 'rgba(16, 185, 129, ',
      amethyst: 'rgba(192, 132, 252, ',
      crimson: 'rgba(244, 63, 94, ',
      sunset: 'rgba(249, 115, 22, ',
      midnight: 'rgba(59, 130, 246, '
    };

    function applyTheme(themeName) {
      if (themeName === 'gold') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', themeName);
      }
      localStorage.setItem('tephdy_theme', themeName);
      
      if (goldMaterial && theme3DColors[themeName]) {
        goldMaterial.color.setHex(theme3DColors[themeName]);
      }

      if (particleRgbColors[themeName]) {
        particleColor = particleRgbColors[themeName];
      }
    }

    themeSelect.addEventListener('change', (e) => {
      applyTheme(e.target.value);
    });

    /* =========================================================
       5. MOBILE DRAWER NAVIGATION
       ========================================================= */
    const menuBtn = document.getElementById('menu-btn');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    function toggleSidebar(open) {
      if (open) {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('active');
      } else {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
      }
    }

    menuBtn.addEventListener('click', () => toggleSidebar(true));
    sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

    /* =========================================================
       6. CONVERSATION HISTORY & LOCAL STORAGE
       ========================================================= */
    const API_ENDPOINT = '/api/chat';
    const SYSTEM_PROMPT = {
      role: 'system',
      content: 'Your name is Tephdy, an AI agent on the Tephdy AI platform by TEPHDY TECH. Be helpful, precise, concise, and smart.'
    };

    const chatBox = document.getElementById('chat-box');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');
    const historyListEl = document.getElementById('history-list');
    const newChatBtn = document.getElementById('new-chat-btn');

    let sessions = JSON.parse(localStorage.getItem('tephdy_chats') || '[]');
    let currentSessionId = null;

    function saveSessions() {
      localStorage.setItem('tephdy_chats', JSON.stringify(sessions));
    }

    function createNewSession() {
      currentSessionId = 'session_' + Date.now();
      const newSession = {
        id: currentSessionId,
        title: 'New Conversation',
        messages: [SYSTEM_PROMPT]
      };
      sessions.unshift(newSession);
      saveSessions();
      renderHistoryList();
      loadSessionMessages(currentSessionId, true);
      toggleSidebar(false);
      promptInput.focus();
    }

    function renderHistoryList() {
      historyListEl.innerHTML = '';
      sessions.forEach(session => {
        const item = document.createElement('div');
        item.classList.add('history-item');
        if (session.id === currentSessionId) item.classList.add('active');

        const titleSpan = document.createElement('span');
        titleSpan.classList.add('item-title');
        titleSpan.textContent = session.title;

        const delBtn = document.createElement('button');
        delBtn.classList.add('delete-btn');
        delBtn.innerHTML = '&#10005;';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteSession(session.id);
        };

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        item.onclick = () => switchSession(session.id);

        historyListEl.appendChild(item);
      });
    }

    function switchSession(id) {
      currentSessionId = id;
      renderHistoryList();
      loadSessionMessages(id, false);
      toggleSidebar(false);
      promptInput.focus();
    }

    function deleteSession(id) {
      sessions = sessions.filter(s => s.id !== id);
      saveSessions();
      if (currentSessionId === id) {
        if (sessions.length > 0) {
          switchSession(sessions[0].id);
        } else {
          createNewSession();
        }
      } else {
        renderHistoryList();
      }
    }

    function loadSessionMessages(id, isNew = false) {
      chatBox.innerHTML = '';
      const session = sessions.find(s => s.id === id);
      if (!session) return;

      const nonSystemMessages = session.messages.filter(m => m.role !== 'system');

      if (nonSystemMessages.length === 0 && isNew) {
        playAnimatedGreeting("Welcome to TEPHDY TECH. I am Tephdy. How can I assist you today?");
      } else {
        nonSystemMessages.forEach(m => appendMessage(m.role, m.content));
      }
    }

    /* =========================================================
       7. CHAT LOGIC & ENGINE EXECUTION
       ========================================================= */
    promptInput.addEventListener('input', () => {
      promptInput.style.height = 'auto';
      promptInput.style.height = Math.min(promptInput.scrollHeight, 90) + 'px';
    });

    function playAnimatedGreeting(text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', 'assistant');
      
      const contentSpan = document.createElement('span');
      const cursor = document.createElement('span');
      cursor.classList.add('typing-cursor');
      
      msgDiv.appendChild(contentSpan);
      msgDiv.appendChild(cursor);
      chatBox.appendChild(msgDiv);

      let index = 0;
      const timer = setInterval(() => {
        if (index < text.length) {
          contentSpan.textContent += text.charAt(index);
          index++;
          chatBox.scrollTop = chatBox.scrollHeight;
        } else {
          clearInterval(timer);
          cursor.remove();
        }
      }, 20);
    }

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', role);
      
      if (role === 'assistant') {
        msgDiv.innerHTML = marked.parse(text);
      } else {
        msgDiv.textContent = text;
      }
      
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    function showPreparingNotice() {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', 'assistant');
      msgDiv.innerHTML = `
        <div class="thinking-notice">
          <div class="thinking-spinner"></div>
          <span>Tephdy is thinking...</span>
        </div>
      `;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    async function sendMessage() {
      const prompt = promptInput.value.trim();
      if (!prompt) return;

      promptInput.value = '';
      promptInput.style.height = '24px';
      sendBtn.disabled = true;

      const activeSession = sessions.find(s => s.id === currentSessionId);
      if (!activeSession) return;

      if (activeSession.messages.length <= 1) {
        activeSession.title = prompt.length > 18 ? prompt.slice(0, 18) + '...' : prompt;
        renderHistoryList();
      }

      appendMessage('user', prompt);
      activeSession.messages.push({ role: 'user', content: prompt });
      saveSessions();

      isThinking = true;
      const prepBubble = showPreparingNotice();

      const payloadMessages = activeSession.messages
        .filter(m => m.role !== 'system')
        .slice(-6);

      try {
        const response = await fetch(API_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: payloadMessages })
        });

        if (!response.ok) throw new Error('Network response was not ok');

        const data = await response.json();
        const replyText = data.response || data.error || "No response received.";

        prepBubble.innerHTML = marked.parse(replyText);
        chatBox.scrollTop = chatBox.scrollHeight;

        activeSession.messages.push({ role: 'assistant', content: replyText });
        saveSessions();
      } catch (e) {
        prepBubble.textContent = "Tephdy engine offline or disconnected.";
      } finally {
        sendBtn.disabled = false;
        isThinking = false;
        promptInput.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    newChatBtn.addEventListener('click', createNewSession);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    window.addEventListener('load', () => {
      // Restore theme option
      const savedTheme = localStorage.getItem('tephdy_theme') || 'gold';
      themeSelect.value = savedTheme;
      applyTheme(savedTheme);

      if (sessions.length === 0) {
        createNewSession();
      } else {
        currentSessionId = sessions[0].id;
        renderHistoryList();
        loadSessionMessages(currentSessionId);
      }
      promptInput.focus();
    });
  </script>
</body>
</html>
