<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TEPHDY TECH | TEPHDY AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Libraries for 3D graphics, Markdown parsing, and syntax highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Particle Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="glow-aura"></div>

  <div class="app-viewport">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar / Mobile Drawer -->
    <div class="sidebar" id="sidebar">
      <button class="btn-new-chat" id="new-chat-btn">+ New Chat</button>
      <div class="history-title">Chat History</div>
      <div class="history-list" id="history-list"></div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <header>
        <div class="left-nav">
          <button class="menu-btn" id="menu-btn" aria-label="Open Menu">&#9776;</button>
          <div class="brand-group">
            <div id="avatar-canvas"></div>
            <div class="logo-group">
              <span class="brand-subtitle">TEPHDY TECH</span>
              <div class="logo">Tephdy <span>AI</span></div>
            </div>
          </div>
        </div>
        <div class="header-actions">
          <select id="theme-select" class="theme-dropdown" aria-label="Select Color Theme">
            <option value="gold">Gold (Default)</option>
            <option value="obsidian">Obsidian</option>
            <option value="slate">Slate</option>
            <option value="silver">Silver</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="emerald">Emerald</option>
            <option value="amethyst">Amethyst</option>
            <option value="crimson">Crimson</option>
            <option value="sunset">Sunset</option>
            <option value="midnight">Midnight</option>
          </select>
          <div class="status-badge">
            <div class="status-dot"></div>
            <span class="status-text">ONLINE</span>
          </div>
        </div>
      </header>

      <div class="chat-section">
        <div class="chat-box" id="chat-box"></div>

        <div class="input-deck">
          <div class="input-wrapper">
            <textarea id="prompt-input" rows="1" placeholder="Message Tephdy..."></textarea>
            <button class="btn-gold" id="send-btn">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
